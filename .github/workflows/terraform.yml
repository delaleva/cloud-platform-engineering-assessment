name: terraform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. Only the plan job raises this.
permissions:
  contents: read

env:
  TF_VERSION: 1.16.3
  TF_IN_AUTOMATION: "true"
  AWS_REGION: eu-west-2

jobs:
  check:
    name: format, validate and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      # No credentials needed: -backend=false skips state entirely.
      - name: Validate every root
        run: |
          for dir in bootstrap environments/dev; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      # Gates the build: findings are deterministic and worth blocking on.
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init --config="${GITHUB_WORKSPACE}/.tflint.hcl"
          tflint --recursive --config="${GITHUB_WORKSPACE}/.tflint.hcl" --format compact

      # Warns only: the documented gaps in this repository would fail it.
      - name: checkov
        continue-on-error: true
        run: |
          pipx install checkov==3.3.19
          checkov --directory . --framework terraform --quiet --compact

  plan:
    name: plan dev
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets this job request the GitHub OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v5

      # TEMPORARY: prints the claims GitHub signs, to compare against the
      # trust policy. Remove once authentication works.
      - name: Show OIDC claims
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          python3 -c "
          import base64, json, sys
          part = sys.argv[1].split('.')[1]
          part += '=' * (-len(part) % 4)
          claims = json.loads(base64.urlsafe_b64decode(part))
          print('sub:       ', claims.get('sub'))
          print('aud:       ', claims.get('aud'))
          print('repository:', claims.get('repository'))
          print('event_name:', claims.get('event_name'))
          " "$token"

      # Exchanges the OIDC token for short-lived credentials. No stored keys.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # Logs are public on a public repository, and a plan prints ARNs.
          mask-aws-account-id: true

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Never written to a file: a plan artefact contains resolved values.
      - name: Plan
        run: |
          terraform -chdir=environments/dev init -input=false
          terraform -chdir=environments/dev plan -input=false -no-color
